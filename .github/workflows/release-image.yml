name: release-image

# 发布 Docker 镜像（替代上游那份只会推 youshandefeiyang/feiyangdigital-bot 的 workflow）
#
# 触发：
#   - push 到 main 且改动涉及代码/构建文件 -> 推 latest + sha-xxxxxxx
#   - 打 v* 标签（如 v1.9.9）              -> 额外推 v1.9.9、1.9 这类版本标签
#   - 手动 workflow_dispatch               -> 便于强制重建（比如修复基础镜像漏洞）
#
# 推送目标：
#   1) GHCR：ghcr.io/<owner>/<repo>，用仓库自带的 GITHUB_TOKEN，**零配置即可用**
#   2) DockerHub：<DOCKERHUB_USERNAME>/feiyangdigital-bot，需在
#      Settings -> Secrets and variables -> Actions 里配置两个 secret：
#         DOCKERHUB_USERNAME  你的 DockerHub 用户名
#         DOCKERHUB_TOKEN     DockerHub 的 Access Token（不是登录密码）
#      未配置时自动跳过 DockerHub，不会让流水线变红。
#
# 首次使用注意（GitHub 侧两个坑）：
#   - fork 之后要在 Actions 页面点一次「I understand my workflows, go ahead and enable them」
#   - GHCR 的包默认是 private，第一次推送后要去 Packages 把可见性改成 public，否则用户 pull 会 401

on:
  push:
    branches: [ "main" ]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/release-image.yml'
    tags: [ "v*" ]
  workflow_dispatch:

env:
  APP_NAME: feiyangdigital-bot

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # 坑：step 的 if 条件里不能引用 secrets 上下文（会报
      # "Unrecognized named-value: 'secrets'" 并导致整个工作流文件校验失败）。
      # 但 jobs.<id>.env 可以引用 secrets，所以先转成普通环境变量再判断。
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker 要求仓库名全小写，而 github.repository 是 Cnievana/feiyangdigital-bot（带大写 C），
      # 直接用会报 "repository name must be lowercase"，所以在这里统一转小写。
      - name: Resolve lowercase image names
        id: img
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=$(printf '%s' "$DH_USER/$APP_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- GHCR（零配置） ----------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.ghcr }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=feiyangdigital-bot
            org.opencontainers.image.description=Telegram 群管理机器人（Cnievana fork）

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      # ---------- DockerHub（配了 secret 才执行） ----------
      - name: Login to DockerHub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (DockerHub)
        if: env.DOCKERHUB_ENABLED == 'true'
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.dockerhub }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push (DockerHub)
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          # 复用上面那次的构建缓存，这一步基本只是把同一份镜像改个名推送
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
